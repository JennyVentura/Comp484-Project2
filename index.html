<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- saw X-UA-Compatible was deprecated, and that IE=edge was for Internet Explorer has been dead since 2022, so shouldn't this be removed? -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- makes the viewing width the size of the device screen width and sets pixels / ratio = to 1 -->
    <script src="script.js" defer></script> <!-- defer so it waits for everything else before it loads the js -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        This is your Giga Pet
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
         <!-- Replace pet image with your own pet image -->
        <img class="pet-image" src=""> <!--Need to add a picture!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!-->
      </section>
      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div>Something: <strong><span class="something"></span> something happens</strong></div> <!--figure something out!!!!!!!!!!!!!!!!!!!!!!-->
        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="something-button"> <!--figure something out!!!!!!!!!!!!!!!!!!!!!!-->
            Something
          </button>
        </div>
      </section>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script> <!-- Link to JQuery library so it can be used. Version here is 2.2.1 (which is not the current). Integrity and crossorigin are for sercurity purposes -->
  </body>
</html>
